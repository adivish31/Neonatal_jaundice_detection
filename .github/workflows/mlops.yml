name: MLOps — Scheduled Retrain & Deploy

on:
  schedule:
    # Run at 02:00 UTC every Sunday
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force retraining even if no new data'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  # ─── Job 1: Retrain & Compare ───
  retrain:
    runs-on: ubuntu-latest
    outputs:
      promoted: ${{ steps.train.outputs.promoted }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      # In production, fetch the latest dataset from cloud storage:
      # - name: Fetch Dataset
      #   run: aws s3 sync s3://your-bucket/jaundice-data ./data
      #   env:
      #     AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Run Training (with model comparison)
        id: train
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
          DATA_DIR: ./data
        run: |
          python train.py --epochs 20 --batch-size 32 --lr 0.0001 --dropout 0.5
          # Check if model was promoted (baseline_metrics.json was updated)
          if [ -f baseline_metrics.json ]; then
            echo "promoted=true" >> $GITHUB_OUTPUT
          else
            echo "promoted=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload baseline metrics artifact
        if: steps.train.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: baseline-metrics
          path: baseline_metrics.json

  # ─── Job 2: Drift Check ───
  drift-check:
    runs-on: ubuntu-latest
    needs: retrain

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install sqlalchemy psycopg2-binary numpy

      - name: Run Drift Detection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python drift_detector.py

  # ─── Job 3: Deploy (only if model was promoted) ───
  deploy:
    runs-on: ubuntu-latest
    needs: retrain
    if: needs.retrain.outputs.promoted == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Commit updated model & baseline
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add baseline_metrics.json
          git add backend/jaundice_model.h5 || true
          git commit -m "chore(mlops): auto-update model via scheduled retrain [skip ci]" || echo "No changes"
          git push

      # If deploying to Render, trigger a deploy hook:
      - name: Trigger Render Deploy
        if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
        run: |
          curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deploy triggered"
